name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Windows Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify LF checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crlfFiles = git ls-files --eol | Select-String 'w/crlf'
          if ($crlfFiles) {
            $crlfFiles
            throw 'Tracked text files were checked out with CRLF.'
          }
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run check
      - name: Production smoke build
        env:
          SITE_URL: https://template-validation.example
        run: npm run build:production
