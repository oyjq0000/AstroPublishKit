name: Refresh quality lockfile

on:
  push:
    branches: [v0.1.1-quality-hardening-followup]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v0.1.1-quality-hardening-followup
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Refresh locked dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Apply repository formatting
        run: npm run format
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh quality tooling lockfile and formatting"
            git push origin HEAD:v0.1.1-quality-hardening-followup
          fi
